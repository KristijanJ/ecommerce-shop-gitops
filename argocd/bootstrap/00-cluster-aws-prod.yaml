# Registers the local (AWS prod EKS) cluster in ArgoCD with an env label so ApplicationSets can select it.
# Apply this before 01-root-platform.yaml. Also add "aws-prod" to the appset selectors once the
# values.aws-prod.yaml files and apps/*/envs/aws-prod overlays exist.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-local
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    env: aws-prod
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
