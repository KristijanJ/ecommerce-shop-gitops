apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: frontend-appset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  generators:
    # Matches clusters by the "env" label on the cluster Secret (see argocd/bootstrap/00-cluster-*.yaml)
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [homelab, aws-prod]
  # Let manual changes to the sync policy (e.g. disabling auto-sync in the UI
  # before a rollback) survive instead of being reset to this template.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: "{{metadata.labels.env}}-frontend"
    spec:
      project: default
      source:
        repoURL: https://github.com/KristijanJ/ecommerce-shop-gitops.git
        targetRevision: HEAD
        path: apps/frontend/envs/{{metadata.labels.env}}
      destination:
        server: "{{server}}"
        namespace: "{{metadata.labels.env}}-frontend"
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
