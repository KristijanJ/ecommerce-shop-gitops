apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-appset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generators:
    # Matches clusters by the "env" label on the cluster Secret (see argocd/bootstrap/00-cluster-*.yaml)
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [homelab, aws-prod]
  template:
    metadata:
      name: "{{metadata.labels.env}}-infrastructure"
    spec:
      project: default
      source:
        repoURL: https://github.com/KristijanJ/ecommerce-shop-gitops.git
        targetRevision: HEAD
        path: apps/infrastructure/envs/{{metadata.labels.env}}
      destination:
        server: "{{server}}"
        namespace: "{{metadata.labels.env}}-infrastructure"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
