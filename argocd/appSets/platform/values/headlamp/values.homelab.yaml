config:
  oidc:
    # The login settings come from the Secret headlamp-oidc (see the ExternalSecret below).
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc
      hasScopes: true

# Every user calls the Kubernetes API with their own Keycloak token, so RBAC decides what they see.
# The chart's default binding would give the Headlamp pod cluster-admin, and nothing needs it.
# The bindings for the Keycloak groups are in apps/infrastructure/envs/homelab/oidc-rbac.yaml.
clusterRoleBinding:
  create: false

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: cert-manager-issuer
  hosts:
    - host: ecommerce-homelab-headlamp.projects.jovanovski.dev
      paths:
        - path: /
          type: Prefix
  tls:
    - hosts:
        - ecommerce-homelab-headlamp.projects.jovanovski.dev
      secretName: headlamp-tls

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# The client secret comes from Vault. The other three values are not secret.
# The chart reads all four from one Secret, so the ExternalSecret template builds it.
# The chart runs every entry through Helm's tpl, so the External Secrets placeholder is escaped.
extraManifests:
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: headlamp-oidc
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "15s"
      secretStoreRef:
        name: vault-secret-store
        kind: ClusterSecretStore
      target:
        name: headlamp-oidc
        creationPolicy: Owner
        deletionPolicy: Retain
        template:
          engineVersion: v2
          mergePolicy: Replace
          data:
            OIDC_CLIENT_ID: headlamp
            OIDC_CLIENT_SECRET: '{{ "{{ .clientSecret }}" }}'
            OIDC_ISSUER_URL: https://ecommerce-homelab-auth.projects.jovanovski.dev/realms/platform
            OIDC_SCOPES: openid profile email groups
      data:
        - secretKey: clientSecret
          remoteRef:
            key: headlamp
            property: headlamp_keycloak_client_secret
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
