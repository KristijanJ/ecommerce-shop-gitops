# Receives OTLP pushed by the apps and forwards it:
#   traces  -> Tempo
#   logs    -> Loki (OTLP endpoint)
#   metrics -> Prometheus (OTLP receiver, enabled in the prometheus-grafana values)
mode: daemonset

service:
  # Enable the creation of a Service.
  # By default, it's enabled on mode != daemonset.
  # However, to enable it on mode = daemonset, its creation must be explicitly enabled
  enabled: true

image:
  repository: otel/opentelemetry-collector-k8s
  tag: "0.161.0"

presets:
  logsCollection:
    enabled: true
  hostMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true
  kubeletMetrics:
    enabled: true
  kubernetesEvents:
    enabled: true
    useK8sEventsReceiver: true
  kubernetesObjects:
    enabled: true
    watch: true
    core:
      enabled: true
    rbac:
      enabled: true
    storage:
      enabled: true
    networking:
      enabled: true
    autoscaling:
      enabled: true
      # VPA resources: verticalpodautoscalers (requires VPA CRD to be installed)
      vpa:
        enabled: false
    policy:
      enabled: true
    apiExtensions:
      enabled: true
    events:
      enabled: true
  clusterMetrics:
    enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Only OTLP is used, so don't expose the Jaeger/Zipkin ports.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    file_log:
      exclude:
      - /var/log/pods/monitoring_opentelemetry-collector*_*/opentelemetry-collector/*.log
      - /var/log/pods/homelab-backend_homelab-ecommerce-be-*/ecommerce-be/*.log
      - /var/log/pods/homelab-frontend_homelab-ecommerce-fe-*/ecommerce-fe/*.log
  connectors:
    # Turns traces into request-count and latency histograms. The histograms carry
    # trace-ID exemplars, which is what Grafana's "View trace" link on a graph uses.
    # The JS SDK doesn't attach exemplars to the apps' own metrics.
    spanmetrics:
      exemplars:
        enabled: true
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    otlp_http/loki:
      endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
    otlp_http/prometheus:
      endpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo, spanmetrics]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/prometheus]
