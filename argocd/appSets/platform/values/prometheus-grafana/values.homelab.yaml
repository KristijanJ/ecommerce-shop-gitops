prometheus:
  prometheusSpec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 2Gi
        cpu: 1000m
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # The OTel collector pushes app metrics here over OTLP.
    enableOTLPReceiver: true
    otlp:
      # Keep service.name as a label so queries can filter on service_name="ecommerce-be".
      promoteResourceAttributes:
        - service.name
    # Store exemplars (trace IDs attached to metrics) so Grafana can link a metric point to its trace.
    enableFeatures:
      - exemplar-storage

grafana:
  sidecar:
    datasources:
      # Metric exemplar -> trace
      exemplarTraceIdDestinations:
        datasourceUid: P214B5B846CF3925F
        traceIdLabelName: trace_id
        # No colon in the label: the chart writes it unquoted, and "Trace: ..." breaks the YAML.
        urlDisplayLabel: "View trace"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  # The admin login comes from Vault (secret/grafana). The sidecars use the same Secret to call the reload endpoints.
  admin:
    existingSecret: grafana-admin
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: cert-manager-issuer
    hosts:
      - ecommerce-homelab-grafana.projects.jovanovski.dev
    path: /
    tls:
      - secretName: grafana-tls
        hosts:
          - ecommerce-homelab-grafana.projects.jovanovski.dev
  additionalDataSources:
    - name: Loki
      type: loki
      # Grafana can't change the uid of an already-provisioned datasource ("data source not found"),
      # so these keep the uids it generated originally. The links below refer to them.
      uid: P8E80F9AEF21F6940
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        # Log -> trace: turn the trace_id field into a link to Tempo.
        derivedFields:
          - name: trace_id
            matcherType: label
            matcherRegex: trace_id
            url: "$${__value.raw}"
            datasourceUid: P214B5B846CF3925F
            urlDisplayLabel: "Trace: $${__value.raw}"
    - name: Tempo
      type: tempo
      uid: P214B5B846CF3925F
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        # Trace -> logs: jump from a span to the logs of the same trace.
        tracesToLogsV2:
          datasourceUid: P8E80F9AEF21F6940
          customQuery: true
          query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
          tags:
            - key: service.name
              value: service_name
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-keycloak
        key: grafana_keycloak_client_secret
  grafana.ini:
    # Must equal the Keycloak client's root URL (see the realm file in the keycloak values).
    server:
      root_url: https://ecommerce-homelab-grafana.projects.jovanovski.dev
    auth.generic_oauth:
      enabled: true
      name: Keycloak-OAuth
      allow_sign_up: true
      client_id: grafana
      scopes: openid email profile groups
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      auth_url: https://ecommerce-homelab-auth.projects.jovanovski.dev/realms/platform/protocol/openid-connect/auth
      token_url: https://ecommerce-homelab-auth.projects.jovanovski.dev/realms/platform/protocol/openid-connect/token
      api_url: https://ecommerce-homelab-auth.projects.jovanovski.dev/realms/platform/protocol/openid-connect/userinfo
      signout_redirect_url: https://ecommerce-homelab-auth.projects.jovanovski.dev/realms/platform/protocol/openid-connect/logout
      # Group names come from the "groups" claim. A user in neither group is denied.
      role_attribute_path: contains(groups[*], 'cluster-admins') && 'Admin' || contains(groups[*], 'viewers') && 'Viewer'
      role_attribute_strict: true

alertmanager:
  alertmanagerSpec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 200m
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

prometheus-node-exporter:
  resources:
    requests:
      memory: 30Mi
      cpu: 10m
    limits:
      memory: 100Mi
      cpu: 200m

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 256Mi
      cpu: 200m

extraManifests:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-keycloak
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "15s"
      secretStoreRef:
        name: vault-secret-store
        kind: ClusterSecretStore
      target:
        name: grafana-keycloak
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: grafana_keycloak_client_secret
          remoteRef:
            key: grafana
            property: grafana_keycloak_client_secret
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-admin
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "15s"
      secretStoreRef:
        name: vault-secret-store
        kind: ClusterSecretStore
      target:
        name: grafana-admin
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: admin-user
          remoteRef:
            key: grafana
            property: admin_user
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
        - secretKey: admin-password
          remoteRef:
            key: grafana
            property: admin_password
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
