prometheus:
  prometheusSpec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 2Gi
        cpu: 1000m
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # The OTel collector pushes app metrics here over OTLP.
    enableOTLPReceiver: true
    otlp:
      # Keep service.name as a label so queries can filter on service_name="ecommerce-be".
      promoteResourceAttributes:
        - service.name
    # Store exemplars (trace IDs attached to metrics) so Grafana can link a metric point to its trace.
    enableFeatures:
      - exemplar-storage

grafana:
  sidecar:
    datasources:
      # Metric exemplar -> trace
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: "Trace: $${__value.raw}"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  adminPassword: admin
  additionalDataSources:
    - name: Loki
      type: loki
      # Fixed uids so the datasources can link to each other.
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        # Log -> trace: turn the trace_id field into a link to Tempo.
        derivedFields:
          - name: trace_id
            matcherType: label
            matcherRegex: trace_id
            url: "$${__value.raw}"
            datasourceUid: tempo
            urlDisplayLabel: "Trace: $${__value.raw}"
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        # Trace -> logs: jump from a span to the logs of the same trace.
        tracesToLogsV2:
          datasourceUid: loki
          customQuery: true
          query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
          tags:
            - key: service.name
              value: service_name

alertmanager:
  alertmanagerSpec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 200m
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

prometheus-node-exporter:
  resources:
    requests:
      memory: 30Mi
      cpu: 10m
    limits:
      memory: 100Mi
      cpu: 200m

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 256Mi
      cpu: 200m
