database:
  vendor: postgres
  hostname: 192.168.0.30
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: keycloak-db
  existingSecretKey: password

http:
  relativePath: "/"

# The image's entrypoint is kc.sh. Without a command it prints its help and exits.
command:
  - /opt/keycloak/bin/kc.sh
  - start

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: cert-manager-issuer
  rules:
    - host: ecommerce-homelab-auth.projects.jovanovski.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ecommerce-homelab-auth.projects.jovanovski.dev
      secretName: keycloak-tls

extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: password
  - name: KC_HOSTNAME
    value: https://ecommerce-homelab-auth.projects.jovanovski.dev

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    memory: 1280Mi

# Start Keycloak after the secrets (wave -1) and the database Job (wave 0).
statefulsetAnnotations:
  argocd.argoproj.io/sync-wave: "1"

# Secrets come from Vault through External Secrets. They live in this release
# so they exist in the keycloak namespace before the StatefulSet starts.
extraManifests:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-db
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "15s"
      secretStoreRef:
        name: vault-secret-store
        kind: ClusterSecretStore
      target:
        name: keycloak-db
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: password
          remoteRef:
            key: keycloak
            property: db-pass
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-admin
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "15s"
      secretStoreRef:
        name: vault-secret-store
        kind: ClusterSecretStore
      target:
        name: keycloak-admin
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: password
          remoteRef:
            key: keycloak
            property: admin-password
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-db-admin
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "15s"
      secretStoreRef:
        name: vault-secret-store
        kind: ClusterSecretStore
      target:
        name: keycloak-db-admin
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: host
          remoteRef:
            key: db
            property: db-host
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
        - secretKey: port
          remoteRef:
            key: db
            property: db-port
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
        - secretKey: user
          remoteRef:
            key: db
            property: db-user
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
        - secretKey: password
          remoteRef:
            key: db
            property: db-pass
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
  # Creates the keycloak role and database if they are missing. Safe to rerun.
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: keycloak-db-init
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "0"
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          containers:
            - name: psql
              image: postgres:18.1
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-admin
                      key: host
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-admin
                      key: port
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-admin
                      key: user
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-admin
                      key: password
                - name: PGDATABASE
                  value: postgres
                - name: KC_DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db
                      key: password
              command: ["/bin/sh", "-c"]
              args:
                - |
                  psql -v ON_ERROR_STOP=1 -v kcpass="$KC_DB_PASS" <<'SQL'
                  SELECT format('CREATE ROLE keycloak LOGIN PASSWORD %L', :'kcpass')
                    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak') \gexec
                  ALTER ROLE keycloak PASSWORD :'kcpass';
                  GRANT keycloak TO CURRENT_USER;
                  SELECT 'CREATE DATABASE keycloak OWNER keycloak'
                    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak') \gexec
                  SQL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
  # Realm "platform" as code. keycloak-config-cli applies this file with the Job below.
  # $(env:NAME) is replaced from the Job's environment, so no secret is in git.
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: keycloak-realm-platform
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    data:
      platform.yaml: |
        realm: platform
        enabled: true
        displayName: Platform
        groups:
          - name: cluster-admins
          - name: viewers
        clientScopes:
          - name: groups
            protocol: openid-connect
            attributes:
              include.in.token.scope: "false"
              display.on.consent.screen: "true"
            protocolMappers:
              - name: groups
                protocol: openid-connect
                protocolMapper: oidc-group-membership-mapper
                config:
                  claim.name: groups
                  full.path: "false"
                  id.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "true"
                  introspection.token.claim: "true"
                  lightweight.claim: "false"
        clients:
          - clientId: grafana
            name: Grafana
            enabled: true
            protocol: openid-connect
            publicClient: false
            secret: "$(env:GRAFANA_KEYCLOAK_CLIENT_SECRET)"
            standardFlowEnabled: true
            implicitFlowEnabled: false
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            rootUrl: https://ecommerce-homelab-grafana.projects.jovanovski.dev
            baseUrl: https://ecommerce-homelab-grafana.projects.jovanovski.dev
            redirectUris:
              - https://ecommerce-homelab-grafana.projects.jovanovski.dev/login/generic_oauth
            webOrigins:
              - https://ecommerce-homelab-grafana.projects.jovanovski.dev
            defaultClientScopes:
              - basic
              - web-origins
              - acr
              - profile
              - roles
              - email
              - groups
  # The Grafana client secret. Grafana reads the same Vault key, so both sides always match.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-realm-secrets
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "15s"
      secretStoreRef:
        name: vault-secret-store
        kind: ClusterSecretStore
      target:
        name: keycloak-realm-secrets
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: grafana-client-secret
          remoteRef:
            key: grafana
            property: grafana_keycloak_client_secret
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
  # Applies the realm file after Keycloak is healthy. It runs on every sync of this app.
  # Safe to rerun: the tool only changes what differs, and deletes only what it created.
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: keycloak-realm-config
      annotations:
        argocd.argoproj.io/hook: PostSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: config-cli
              image: adorsys/keycloak-config-cli:6.5.1-26.5.5
              env:
                - name: KEYCLOAK_URL
                  value: http://keycloak-keycloakx-http.keycloak.svc.cluster.local
                - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
                  value: "true"
                - name: KEYCLOAK_USER
                  value: admin
                - name: KEYCLOAK_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-admin
                      key: password
                - name: IMPORT_FILES_LOCATIONS
                  value: /config/*.yaml
                - name: IMPORT_VARSUBSTITUTION_ENABLED
                  value: "true"
                - name: GRAFANA_KEYCLOAK_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-realm-secrets
                      key: grafana-client-secret
              volumeMounts:
                - name: realm
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: realm
              configMap:
                name: keycloak-realm-platform
