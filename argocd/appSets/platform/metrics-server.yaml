apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: metrics-server-appset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generators:
    # Matches clusters by the "env" label on the cluster Secret (see argocd/bootstrap/00-cluster-*.yaml)
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [homelab, aws-prod]
        values:
          repoURL: https://kubernetes-sigs.github.io/metrics-server/
          targetRevision: 3.13.0
  template:
    metadata:
      name: "{{metadata.labels.env}}-metrics-server"
    spec:
      project: default
      sources:
        - chart: metrics-server
          repoURL: "{{values.repoURL}}"
          targetRevision: "{{values.targetRevision}}"
          helm:
            releaseName: metrics-server
            valueFiles:
              - $values/argocd/appSets/platform/values/metrics-server/values.{{metadata.labels.env}}.yaml
        - repoURL: https://github.com/KristijanJ/ecommerce-shop-gitops.git
          targetRevision: HEAD
          ref: values
      destination:
        server: "{{server}}"
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
