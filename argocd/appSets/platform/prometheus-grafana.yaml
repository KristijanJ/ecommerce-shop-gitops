apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus-grafana-appset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generators:
    # Matches clusters by the "env" label on the cluster Secret (see argocd/bootstrap/00-cluster-*.yaml)
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [homelab, aws-prod]
        values:
          repoURL: https://prometheus-community.github.io/helm-charts
          targetRevision: 80.14.3
  template:
    metadata:
      name: "{{metadata.labels.env}}-prometheus-grafana"
    spec:
      project: default
      sources:
        - chart: kube-prometheus-stack
          repoURL: "{{values.repoURL}}"
          targetRevision: "{{values.targetRevision}}"
          helm:
            releaseName: kube-prometheus-stack
            valueFiles:
              - $values/argocd/appSets/platform/values/prometheus-grafana/values.{{metadata.labels.env}}.yaml
        - repoURL: https://github.com/KristijanJ/ecommerce-shop-gitops.git
          targetRevision: HEAD
          ref: values
      destination:
        server: "{{server}}"
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
