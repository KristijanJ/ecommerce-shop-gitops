apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets-appset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  generators:
    # Matches clusters by the "env" label on the cluster Secret (see argocd/bootstrap/00-cluster-*.yaml)
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [homelab, aws-prod]
        values:
          repoURL: https://charts.external-secrets.io
          targetRevision: 1.2.1
  template:
    metadata:
      name: "{{metadata.labels.env}}-external-secrets"
    spec:
      project: default
      sources:
        - chart: external-secrets
          repoURL: "{{values.repoURL}}"
          targetRevision: "{{values.targetRevision}}"
          helm:
            releaseName: external-secrets
            valueFiles:
              - $values/argocd/appSets/platform/values/external-secrets/values.{{metadata.labels.env}}.yaml
        - repoURL: https://github.com/KristijanJ/ecommerce-shop-gitops.git
          targetRevision: HEAD
          ref: values
      destination:
        server: "{{server}}"
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
