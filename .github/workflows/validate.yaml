name: validate

# Runs the same checks as `make validate` (see scripts/validate/).
# On pull requests it also reports what the change does to the rendered
# manifests. The job name "validate" is the name the main ruleset requires.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the whole git history, and the diff report needs the
          # base commit of the pull request
          fetch-depth: 0

      - name: Install kubeconform, yq and gitleaks
        run: |
          ./scripts/validate/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The scripts download each chart once, into ~/.cache/gitops-charts.
      # Keep that folder between runs. The key changes when a chart version in
      # an ApplicationSet changes. Then restore-keys restores the newest older
      # cache, and only the charts that are missing from it are downloaded.
      - uses: actions/cache@v6
        id: chart-cache
        with:
          path: ~/.cache/gitops-charts
          key: charts-${{ hashFiles('argocd/appSets/platform/*.yaml') }}
          restore-keys: charts-

      - name: Run the checks
        run: ./scripts/validate/validate.sh

      # Not part of the pass or fail result. A problem here must not block a merge.
      - name: Show what the pull request changes
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/validate/diff-rendered.sh "$BASE_SHA"

      - name: Chart cache summary
        if: always()
        env:
          PRIMARY_KEY: ${{ steps.chart-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.chart-cache.outputs.cache-matched-key }}
        run: ./scripts/validate/cache-summary.sh
