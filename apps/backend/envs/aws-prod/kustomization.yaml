apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

namePrefix: aws-prod-
nameSuffix: ""

patches:
  # Read the DB connection details from AWS Secrets Manager instead of Vault
  - target:
      kind: ExternalSecret
      name: db-credentials
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: aws-secret-store
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: /ecommerce/prod/db
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: /ecommerce/prod/db
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: /ecommerce/prod/db
      - op: replace
        path: /spec/data/3/remoteRef/key
        value: /ecommerce/prod/db
      - op: replace
        path: /spec/data/4/remoteRef/key
        value: /ecommerce/prod/db

  - target:
      kind: ExternalSecret
      name: jwt-secret
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: aws-secret-store
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: /ecommerce/prod/jwt
