apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: db-credentials
  data:
    - secretKey: db-database
      remoteRef:
        key: db
        property: db-database
    - secretKey: db-pass
      remoteRef:
        key: db
        property: db-pass
    - secretKey: db-user
      remoteRef:
        key: db
        property: db-user
    - secretKey: db-host
      remoteRef:
        key: db
        property: db-host
    - secretKey: db-port
      remoteRef:
        key: db
        property: db-port
