apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-be
spec:
  selector:
    matchLabels:
      app: ecommerce-be
  template:
    metadata:
      labels:
        app: ecommerce-be
    spec:
      containers:
        - name: ecommerce-be
          image: kristijan92/ecommerce-shop-be:1.1.4
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: "DB_HOST"
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db-host
            - name: "DB_PORT"
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db-port
            - name: "DB_USER"
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db-user
            - name: "DB_PASS"
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db-pass
            - name: "DB_DATABASE"
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db-database
            - name: "JWT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret
            - name: "OTEL_SERVICE_NAME"
              value: "ecommerce-be"
            - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
              value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4318"
            # Give each pod its own metric series. Without an instance id, all replicas
            # write to the same series and rate() counts every counter reset.
            - name: "POD_NAME"
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: "OTEL_RESOURCE_ATTRIBUTES"
              value: "service.instance.id=$(POD_NAME)"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
