apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
# Create the volume in the zone of the pod that uses it
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# The EBS volume is deleted together with its PVC, so it does not outlive terraform destroy
reclaimPolicy: Delete
