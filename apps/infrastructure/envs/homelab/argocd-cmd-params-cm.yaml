# Traefik ends TLS, so argocd-server serves plain HTTP. Without this it redirects HTTP to HTTPS and the Ingress loops.
# ArgoCD reads this ConfigMap at startup: run `kubectl rollout restart deploy/argocd-server -n argocd` after a change.
# Only the keys this repo owns are listed. Prune=false keeps ArgoCD from deleting the ConfigMap if this file is removed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
data:
  server.insecure: "true"
