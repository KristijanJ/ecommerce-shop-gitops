apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-fe
spec:
  selector:
    matchLabels:
      app: ecommerce-fe
  template:
    metadata:
      labels:
        app: ecommerce-fe
    spec:
      containers:
        - name: ecommerce-fe
          image: kristijan92/ecommerce-shop-fe:1.1.6
          resources:
            requests:
              memory: "128Mi"
              cpu: "150m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: "API_URL"
              value: "http://ecommerce-be-service"
            - name: "API_PORT"
              value: "80"
            - name: "JWT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret
            - name: "REDIS_HOST"
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-fe
                  key: redis_host
            - name: "REDIS_PORT"
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-fe
                  key: redis_port
            - name: "OTEL_SERVICE_NAME"
              value: "ecommerce-fe"
            - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
              value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4318"
            # Give each pod its own metric series. Without an instance id, all replicas
            # write to the same series and rate() counts every counter reset.
            - name: "POD_NAME"
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: "OTEL_RESOURCE_ATTRIBUTES"
              value: "service.instance.id=$(POD_NAME)"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
